# HyperTeX: 테스트 → (태그 v* 이면) 세 OS 에서 뷰어 빌드 → GitHub Release.
# 서명·공증은 비밀값이 있을 때만 돈다. 필요한 비밀값은 packaging/README.md "서명과 공증".
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: "태그 없이도 빌드 단계까지 돌리기 (릴리스는 만들지 않음)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Linux Qt 의존 라이브러리
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libasound2t64 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: 설치
        run: python -m pip install ".[viewer,dev]" pytest-timeout
      - name: 단위 테스트
        shell: bash
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
        # 테스트 하나가 2분을 넘으면 스택을 남기고 끝낸다 (thread 방식은 윈도에서도 동작).
        # 출력은 파이프가 아니라 파일로: 테스트가 남긴 하위 프로세스가 파이프를 붙잡아 단계가 끝나지 않는 것을 막는다.
        run: |
          python -m pytest -v -rfE --timeout=120 --timeout-method=thread tests/unit > pytest.log 2>&1
          status=$?
          tail -5 pytest.log
          exit $status
      - name: 실패 내용을 주석으로
        if: failure() || cancelled()
        shell: bash
        run: python .github/ci_annotate.py pytest.log "${{ matrix.os }} py${{ matrix.python }}"
      - name: 테스트 문서 묶음
        run: python tools/run_all.py

  build:
    name: build (${{ matrix.os }})
    needs: test
    # 릴리스: 태그 v* 를 올리거나, 태그를 올릴 수 없는 환경에서는 브랜치 release/v* 를 올린다 (태그는 release 작업이 만든다).
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || inputs.build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # 오래된 glibc 에서 빌드해야 새 배포판에서도 돈다
          - os: macos-15            # Apple Silicon (arm64)
          - os: macos-15-intel      # Intel (x86_64). 러너 이름은 GitHub 이 바꾸므로 릴리스 전에 확인
          - os: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # 단계의 if 는 그 단계 자신의 env 를 볼 수 없으므로 비밀값 유무를 작업 수준에서 표시해 둔다.
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_MACOS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Linux 빌드 도구
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libasound2 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 desktop-file-utils shared-mime-info
      - name: 설치
        run: python -m pip install ".[viewer,build]"
      - name: 태그와 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: bash
        run: |
          v=$(python -c "import htex; print(htex.__version__)")
          ref="${GITHUB_REF_NAME#release/}"
          test "v$v" = "$ref" || { echo "태그(또는 release/ 브랜치) $ref 와 htex.__version__ $v 가 다르다"; exit 1; }
      - name: 아이콘
        run: python packaging/icons/make_icons.py
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/htex-viewer.spec
      - name: 번들 점검
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then python packaging/check_bundle.py dist/HyperTeX.app
          else python packaging/check_bundle.py dist/htex-viewer; fi
      - name: 스모크 테스트 (화면 없이 예제 문서 열기)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   exe=dist/HyperTeX.app/Contents/MacOS/htex-viewer ;;
            Windows) exe=dist/htex-viewer/htex-viewer.exe ;;
            *)       exe=dist/htex-viewer/htex-viewer ;;
          esac
          python packaging/smoke_test.py "$exe" --out dist/smoke-${{ matrix.os }}
      - name: 스모크 스크린숏 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: dist/smoke-*
          if-no-files-found: ignore

      # ---------------- Linux: tar.gz + AppImage ----------------
      - name: Linux 패키지
        if: runner.os == 'Linux'
        run: |
          packaging/linux/make-tarball.sh dist/htex-viewer dist/release
          packaging/linux/make-appimage.sh dist/htex-viewer "dist/release/HyperTeX-$(python -c 'import htex;print(htex.__version__)')-x86_64.AppImage"
          python packaging/smoke_test.py dist/release/*.AppImage --out dist/smoke-appimage

      # ---------------- macOS: 서명(선택) → DMG → 공증(선택) ----------------
      - name: macOS 인증서 가져오기
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: macOS 서명
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: packaging/macos/sign-and-notarize.sh sign dist/HyperTeX.app
      - name: macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/release
          packaging/macos/make-dmg.sh dist/HyperTeX.app \
            "dist/release/HyperTeX-$(python -c 'import htex;print(htex.__version__)')-macos-$(uname -m).dmg"
      - name: macOS 공증
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true' && env.HAS_MACOS_NOTARY == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          for f in dist/release/*.dmg; do packaging/macos/sign-and-notarize.sh notarize "$f"; done

      # ---------------- Windows: (서명) → Inno Setup ----------------
      - name: Inno Setup 설치
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Windows 실행 파일 서명
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\htex-viewer\htex-viewer.exe
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Windows 설치 프로그램
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $v = python -c "import htex; print(htex.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $isccArgs = @("/DAppVersion=$v", "/DOutputDir=..\..\dist\release")
          if ($env:SIGNTOOL) {
            $isccArgs += "/Ssigntool=`"$env:SIGNTOOL`" sign /f `"$env:PFX_PATH`" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f"
            $isccArgs += "/DSignTool=signtool"
          }
          & $iscc @isccArgs packaging\windows\htex-viewer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\htex-viewer -DestinationPath "dist\release\HyperTeX-$v-windows-x64.zip"
          if ($env:PFX_PATH) { Remove-Item $env:PFX_PATH -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: 체크섬
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 태그 이름
        id: tag
        shell: bash
        run: echo "name=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
          generate_release_notes: true
          # release/v* 브랜치에서 왔으면 이 커밋에 태그를 새로 만든다 (태그 푸시에서 왔으면 그 태그 그대로)
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
