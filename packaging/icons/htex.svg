<?xml version="1.0" encoding="UTF-8"?>
<!-- HyperTeX 뷰어 앱 아이콘 원본. 둥근 사각형 안에 적분 기호와 연결(링크) 점.
     글꼴 없이 선과 원만으로 그려 어느 렌더러에서나 같게 보인다.
     PNG·ICO·ICNS 는 packaging/icons/make_icons.py 로 다시 만든다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5bd3"/>
      <stop offset="1" stop-color="#1b2f86"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <!-- 적분 기호 -->
  <path d="M 620 250 C 560 180, 470 200, 462 300 L 432 720 C 424 820, 334 840, 274 770"
        fill="none" stroke="#ffffff" stroke-width="78" stroke-linecap="round"/>
  <!-- 링크(하이퍼텍스트) 점 두 개와 연결선 -->
  <path d="M 640 610 L 760 500" fill="none" stroke="#ffb347" stroke-width="34" stroke-linecap="round"/>
  <circle cx="640" cy="610" r="52" fill="#ffb347"/>
  <circle cx="760" cy="500" r="52" fill="#ffb347"/>
</svg>
